
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Processando</title>
</head>
<body>

<script>
(async function() {
    try {
        await fetch('http://localhost/seguranca/logout.php', {
            method: 'GET',
            credentials: 'include',
            cache: 'no-store'
        });

        console.log('Logout processado.');
    } catch (error) {
        console.error('Erro ao executar logout:', error);
    }
})();
</script>

</body>
</html>
